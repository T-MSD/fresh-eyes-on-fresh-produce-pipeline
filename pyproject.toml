[project]
name = "fresh-eyes"
version = "0.1.0"
description = "Shelf monitoring pipeline and API for the Sensei JunctionX Lisbon 2026 challenge"
readme = "README.md"
authors = [
    { email = "tiago.dias@indiecampers.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.0",
    "sqlalchemy>=2.1.4",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
ml = [
    "open-clip-torch>=3.3.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"config/db/migrations/versions/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.alembic]
script_location = "%(here)s/config/db/migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
