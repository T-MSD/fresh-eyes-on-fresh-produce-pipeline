[project]
name = "fresh-eyes"
version = "0.1.0"
description = "Shelf monitoring pipeline and API for the Sensei JunctionX Lisbon 2026 challenge"
readme = "README.md"
authors = [
    { email = "tiago.dias@indiecampers.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.14.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
ml = [
    "open-clip-torch>=3.3.0",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/*.py" = ["E501"]  # long docstrings and embedded HTML/JS pages in the pipeline scripts

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "typer.Option", "typer.Argument"]
